<span [class]="combinedClasses">
  @if (ping) {
    <span class="relative flex h-2.5 w-2.5 items-center justify-center">
      <span class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" [ngClass]="pingColor"></span>
      <span class="relative inline-flex rounded-full h-2 w-2" [ngClass]="pingColor"></span>
    </span>
  }
  @if (label) {
    <span>{{ label }}</span>
  }
  <ng-content></ng-content>
</span>
