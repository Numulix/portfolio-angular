<div [class]="combinedClasses">
  @if (headerTitle || headerBadge) {
    <div class="flex items-center justify-between pb-3 mb-4 border-b-2 border-black font-mono text-xs font-bold">
      @if (headerTitle) {
        <span class="flex items-center gap-2">
          <span class="w-3 h-3 bg-nb-yellow border border-black inline-block"></span>
          <span>{{ headerTitle }}</span>
        </span>
      }
      @if (headerBadge) {
        <span [class]="'px-2 py-0.5 border border-black shadow-[2px_2px_0px_#000] font-mono text-xs font-extrabold uppercase ' + headerBadgeColor">
          {{ headerBadge }}
        </span>
      }
    </div>
  }
  <ng-content></ng-content>
</div>
